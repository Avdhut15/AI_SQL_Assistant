<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AI SQL Assistant – Convert plain English into executable SQL queries instantly using AI." />
  <meta name="keywords" content="AI, SQL, Natural Language, Query Generator, Flask, Gemini" />
  <title>AI SQL Assistant – Natural Language to SQL</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- App CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗄️</text></svg>" />
</head>
<body>

  <!-- React mount point -->
  <div id="root"></div>

  <!-- Toast portal target (outside #root so portals work correctly) -->
  <div id="toast-root"></div>

  <!--
    React 18 production builds (no console warnings, smaller payload).
    htm v3 — hyperscript markup tagging. Gives JSX-like syntax with NO build step,
    NO Babel, NO transpilation. Script is loaded as a plain <script>, not text/babel.
  -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/htm@3/dist/htm.js" crossorigin></script>

  <!-- Flask template data exposed to JS -->
  <script>
    window.__APP_CONFIG__ = { year: "{{ year }}" };
  </script>

  <!-- Main app — plain JS, no transpilation required -->
  <script src="{{ url_for('static', filename='script.js') }}?v=2"></script>

</body>
</html>
